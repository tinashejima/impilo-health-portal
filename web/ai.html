<!DOCTYPE html>
<html lang="en">
<head><script src="config.js"></script>
<script src="./auth.js?v=3"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ask the data</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b1f3a;--ink2:#465f88;--muted:#637797;--line:#e3e9f3;--grid:#edf1f7;--green:#218a39;--green-dark:#176c2b;--green-bg:#ecf7ee;--gold:#d99a00;--rose:#c62f2f;--rose-bg:#fdecec}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:var(--ink);font-family:Inter,-apple-system,"Segoe UI",sans-serif;font-size:14px}
h1,h2,h3{font-family:"Plus Jakarta Sans",Inter,sans-serif;margin:0}
button,input,select,textarea{font:inherit}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:0 10px 25px -18px rgba(11,31,58,.25)}
.card h2{font-size:15px;font-weight:700}
.sub{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.45}
.wrap{display:grid;gap:16px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--ink2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--green-dark);border-bottom-color:var(--green)}
.btn{font-size:13px;font-weight:600;border-radius:9px;padding:8px 14px;border:1px solid var(--green);background:var(--green);color:#fff;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--green-dark)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:#fff;color:var(--green)}.btn.ghost:hover:not(:disabled){background:var(--green-bg)}
.btn.danger{background:#fff;color:var(--rose);border-color:#f3c6c6}.btn.danger:hover:not(:disabled){background:var(--rose-bg)}
.btn.sm{padding:5px 10px;font-size:12px}
input[type=text],input[type=number],select,textarea{border:1px solid #d7dfec;border-radius:9px;background:#f8fafc;color:var(--ink);padding:8px 10px;font-size:13px;width:100%}
textarea{resize:vertical;min-height:70px;line-height:1.45}
label.f{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:12px 0 5px}
.help{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.45}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap}
.pill.on{background:var(--green-bg);color:var(--green-dark)}.pill.off{background:#f1f5f9;color:var(--muted)}.pill.bad{background:var(--rose-bg);color:#b42318}.pill.warn{background:#fdf1d6;color:#8a5a00}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.notice{border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.5}
.notice.info{background:#f4f8fd;border:1px solid #dbe6f5}.notice.warn{background:#fffaf0;border:1px solid #f4e2b8}.notice.bad{background:var(--rose-bg);border:1px solid #f3c6c6;color:#8f1d1d}.notice.ok{background:var(--green-bg);border:1px solid #cfe9d5}
.notice a,.linkbtn{color:var(--green-dark);font-weight:600;cursor:pointer;background:none;border:0;padding:0;text-decoration:underline}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;color:var(--ink2);text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--grid);vertical-align:middle}
td.num{text-align:right;font-variant-numeric:tabular-nums}
/* ask: WhatsApp-style chat with saved conversations */
.ask-mode body,.ask-mode html{background:transparent}
.ask-mode .card.shell{padding:0;overflow:hidden}
.wa{display:grid;grid-template-columns:300px 1fr;height:720px;border-radius:16px;overflow:hidden;background:#fff}
.wa-list{border-right:1px solid #e9edef;display:flex;flex-direction:column;min-height:0;background:#fff}
.wa-list-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#f0f2f5;border-bottom:1px solid #e9edef}
.wa-list-head h2{font-size:16px}
.wa-new{border:0;background:var(--green);color:#fff;border-radius:999px;padding:7px 13px;font-weight:600;font-size:12.5px;cursor:pointer}
.wa-new:hover{background:var(--green-dark)}
.wa-search{padding:8px 12px;border-bottom:1px solid #f0f2f5}
.wa-search input{border-radius:9px;background:#f0f2f5;border:0;padding:8px 12px}
.wa-chats{overflow:auto;flex:1}
.wa-chat{display:flex;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid #f2f4f5;cursor:pointer;position:relative}
.wa-chat:hover{background:#f5f6f6}.wa-chat.on{background:#f0f2f5}
.wa-chat .t{flex:1;min-width:0}
.wa-chat .t b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wa-chat .t span{display:block;font-size:12px;color:#667781;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.wa-chat .when{font-size:11px;color:#667781;align-self:flex-start;margin-top:2px}
.wa-chat .del{position:absolute;right:10px;bottom:8px;border:0;background:none;color:#b42318;font-size:11px;cursor:pointer;display:none}
.wa-chat:hover .del,.wa-chat .del.confirm{display:block}
.wa-filter{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid #f0f2f5}
.wa-filter button{display:inline-flex;align-items:center;gap:5px;border:0;background:#f0f2f5;color:#54656f;border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer}
.wa-filter button[aria-selected=true]{background:#e7f6ea;color:var(--green-dark)}
.wa-filter svg{width:14px;height:14px}
.wa-sec{display:flex;align-items:center;gap:6px;padding:10px 16px 4px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#667781}
.wa-sec svg{width:13px;height:13px}
.wa-chat .side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;align-self:stretch}
.star{border:0;background:none;padding:2px;cursor:pointer;line-height:0;border-radius:6px;opacity:.55}
.wa-chat:hover .star,.star.on{opacity:1}.star:hover{background:#eef1f3}
.star.big{opacity:1;padding:6px}.star.big svg{width:21px;height:21px}
.wa-chat .del{bottom:8px;right:40px}
.avatar.bot{background:none;padding:0;filter:drop-shadow(0 1px 2px rgba(11,20,26,.18))}
.avatar.bot svg,.mini svg,.hero-bot svg{width:100%;height:100%;display:block}
.avatar.bot.big{width:42px;height:42px}
.botsvg .eye{transform-box:fill-box;transform-origin:center;animation:botblink 5s infinite}
@keyframes botblink{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.12)}}
.thinking .botsvg .ant{animation:botant .7s ease-in-out infinite alternate}
.thinking .botsvg .eye{animation:botlook 1.4s ease-in-out infinite}
@keyframes botant{from{fill:#fbbf24}to{fill:#fef3c7;r:3.4}}
@keyframes botlook{0%,100%{transform:translateX(0)}30%{transform:translateX(-1.2px)}70%{transform:translateX(1.2px)}}
.botrow{align-self:flex-start;display:flex;align-items:flex-start;gap:8px;max-width:min(84%,670px);margin-top:6px}
.botrow.cont{margin-top:2px}
.botrow .bub{max-width:100%;margin-top:0}
.mini{flex:none;width:30px;height:30px;margin-top:1px;filter:drop-shadow(0 1px 1.5px rgba(11,20,26,.18))}
.wa-hero{display:flex;flex-direction:column;align-items:center;gap:3px;margin:8px auto 4px;text-align:center;color:#3b4a54}
.wa-hero b{font-size:16px;color:#111b21;margin-top:6px}
.wa-hero span{font-size:13px;color:#667781}
.hero-bot{width:84px;height:84px;filter:drop-shadow(0 6px 14px rgba(20,83,45,.28));animation:botfloat 3.2s ease-in-out infinite}
@keyframes botfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.wa-empty-list{padding:24px 18px;color:#667781;font-size:13px;line-height:1.5}
.avatar{flex:none;width:40px;height:40px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.avatar svg{width:22px;height:22px}
.wa-pane{display:flex;flex-direction:column;min-height:0;min-width:0}
.wa-head{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#f0f2f5;border-bottom:1px solid #e9edef}
.wa-head .who{flex:1;min-width:0}
.wa-head .who b{display:block;font-size:14.5px}
.wa-head .who span{display:block;font-size:12px;color:#667781;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wa-head .who span.typing{color:var(--green-dark);font-weight:600}
.wa-head select{width:auto;max-width:230px;background:#fff;font-size:12.5px;padding:6px 8px}
.wa-scope{font-size:11.5px;color:#54656f;background:#fff;border-bottom:1px solid #e9edef;padding:6px 16px}
.wa-msgs{flex:1;overflow:auto;padding:14px 6% 18px;display:flex;flex-direction:column;gap:3px;
  background-color:#efeae2;background-image:radial-gradient(rgba(0,0,0,.035) 1px,transparent 1.5px),radial-gradient(rgba(0,0,0,.025) 1px,transparent 1.5px);background-size:22px 22px,22px 22px;background-position:0 0,11px 11px}
.wa-day{align-self:center;background:#fff;color:#54656f;font-size:11.5px;padding:5px 12px;border-radius:8px;margin:10px 0 6px;box-shadow:0 1px .5px rgba(11,20,26,.13)}
.bub{position:relative;max-width:min(78%,620px);padding:7px 10px 6px;border-radius:8px;font-size:13.8px;line-height:1.5;box-shadow:0 1px .5px rgba(11,20,26,.13);margin-top:6px;word-wrap:break-word}
.bub.me{align-self:flex-end;background:#d9fdd3;border-top-right-radius:0}
.bub.bot{align-self:flex-start;background:#fff;border-top-left-radius:0}
.bub.me:before,.bub.bot:before{content:"";position:absolute;top:0;width:10px;height:13px}
.bub.me:before{right:-8px;background:linear-gradient(225deg,transparent 50%,#d9fdd3 50%)}
.bub.bot:before{left:-8px;background:linear-gradient(135deg,transparent 50%,#fff 50%)}
.bub.cont{margin-top:2px;border-radius:8px}.bub.cont:before{display:none}
.bub.err{background:#fdecec;color:#8f1d1d}.bub.err:before{background:linear-gradient(135deg,transparent 50%,#fdecec 50%)}
.bub ul{margin:4px 0 2px;padding-left:18px}
.bub .foot{float:right;margin:6px 0 -4px 12px;font-size:10.5px;color:#667781;display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.bub .foot svg{width:16px;height:11px}
.bub .src{display:block;clear:both;font-size:10.5px;color:#667781;margin-top:4px;border-top:1px solid #f0f2f5;padding-top:3px}
.bub.writing .txt:after{content:"▍";animation:blink 1s steps(1) infinite;margin-left:1px;color:var(--green)}
.dots{display:inline-flex;gap:4px;padding:4px 2px}.dots i{width:7px;height:7px;border-radius:50%;background:#9aa7b0;animation:bounce 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.6}30%{transform:translateY(-4px);opacity:1}}
@keyframes blink{50%{opacity:0}}
.wa-welcome{align-self:center;max-width:520px;background:#fff8c5;color:#54656f;font-size:12.5px;text-align:center;padding:10px 14px;border-radius:8px;margin:14px 0;box-shadow:0 1px .5px rgba(11,20,26,.13);line-height:1.5}
.wa-sugg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:6px}
.wa-sugg button{border:0;background:#fff;color:#0b6b2e;border-radius:18px;padding:7px 13px;font-size:12.5px;cursor:pointer;box-shadow:0 1px .5px rgba(11,20,26,.13)}
.wa-sugg button:hover{background:#f5fbf6}
.wa-compose{display:flex;gap:8px;align-items:flex-end;padding:10px 14px;background:#f0f2f5}
.wa-compose textarea{flex:1;border:0;border-radius:22px;background:#fff;padding:11px 16px;min-height:44px;max-height:140px;resize:none;font-size:14px;line-height:1.4}
.wa-compose textarea:focus{outline:2px solid #b7dcbf}
.wa-send{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--green);color:#fff;display:grid;place-items:center;cursor:pointer}
.wa-send:hover:not(:disabled){background:var(--green-dark)}.wa-send:disabled{background:#a9c7b1;cursor:default}
.wa-send svg{width:21px;height:21px}
.wa-banner{margin:10px 6% 0}
@media(max-width:900px){.wa{grid-template-columns:1fr}.wa-list{display:none}}

/* models */
.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:12px}
.model{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.model b{font-size:13.5px}.model code{font-size:11.5px;color:var(--ink2)}
.model .foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:6px}
.bar{height:8px;background:#eef2f7;border-radius:4px;overflow:hidden;margin-top:6px}
.bar>div{height:100%;background:var(--green);transition:width .4s}
.hw{display:flex;flex-wrap:wrap;gap:18px;margin-top:10px;font-size:13px}
.hw div b{display:block;font-family:"Plus Jakarta Sans",Inter,sans-serif;font-size:18px}
/* optimise */
.optgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 22px}
input[type=range]{width:100%;accent-color:var(--green)}
.rangeval{font-weight:700;font-variant-numeric:tabular-nums;font-size:12px;color:var(--ink)}
details.adv summary{cursor:pointer;color:var(--green-dark);font-weight:600;font-size:13px;margin-top:14px}
/* train */
.train{display:grid;grid-template-columns:260px 1fr;gap:16px}
.alist button{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.alist button[aria-current=true]{border-color:var(--green);background:var(--green-bg)}
.alist button small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.styles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.styles label{border:1px solid var(--line);border-radius:10px;padding:9px 10px;cursor:pointer;font-size:12.5px}
.styles label:has(input:checked){border-color:var(--green);background:var(--green-bg)}
.styles input{margin-right:6px;accent-color:var(--green)}
.ex{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;display:grid;grid-template-columns:1fr auto;gap:6px 10px}
.ex textarea{min-height:44px}
.toggle{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:13px}
.toggle input{margin-top:3px;accent-color:var(--green);width:16px;height:16px}
.toast{position:fixed;right:16px;bottom:16px;background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);display:none;max-width:420px;z-index:9}
@media(max-width:1000px){.grid2,.train,.optgrid{grid-template-columns:1fr}.styles{grid-template-columns:1fr 1fr}}

/* ---- Ask the data: simple dotted layout ---- */
.wa{grid-template-columns:270px 1fr;height:760px;border:1px solid #e5e7eb;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.wa-list{background:#fff}.wa-list-head{background:#fff}
.wa-pane{position:relative;background-color:#fafafa;background-image:radial-gradient(#d4d7dd 1.1px,transparent 1.3px);background-size:20px 20px}
.wa-head{background:rgba(250,250,250,.85);backdrop-filter:blur(4px);border-bottom:1px solid #eceef1;padding:10px 20px}
.wa-head.bare{position:absolute;top:0;right:0;left:auto;background:none;border:0;z-index:2;backdrop-filter:none}
.wa-head .who b{font-size:14px;font-weight:600}
.wa-msgs{background:none!important;padding:22px max(24px,calc(50% - 390px)) 10px;gap:4px}
.wa-msgs.start{justify-content:center;align-items:center}
.wa-start{width:min(680px,100%);display:flex;flex-direction:column;align-items:center;gap:22px;margin-top:-40px}
.wa-start h1{font-size:30px;font-weight:700;letter-spacing:-.02em;color:#111827;margin:0;text-align:center}
.wa-start .wa-compose{width:100%;padding:0}
.wa-start .wa-sugg{margin-top:-4px}
.wa-sugg button{background:#fff;border:1px solid #e5e7eb;box-shadow:none;color:#374151;border-radius:999px}
.wa-sugg button:hover{border-color:var(--green);color:var(--green-dark);background:#fff}
.wa-compose{background:none;padding:10px max(24px,calc(50% - 390px)) 22px;display:block}
.wa-compose .wa-pill{position:relative;background:#fff;border:1px solid #dfe3ea;border-radius:22px;box-shadow:0 10px 30px -14px rgba(15,23,42,.25);transition:border-color .15s,box-shadow .15s}
.wa-compose .wa-pill:focus-within{border-color:#9fd2ab;box-shadow:0 0 0 4px rgba(33,138,57,.10),0 10px 30px -14px rgba(15,23,42,.25)}
.wa-compose textarea{display:block;width:100%;border:0!important;outline:0!important;background:none;border-radius:22px;padding:19px 70px 19px 22px;min-height:62px;max-height:180px;font-size:15px;line-height:1.45;resize:none;box-shadow:none}
.wa-send{position:absolute;right:10px;bottom:10px;width:42px;height:42px;border-radius:13px;background:linear-gradient(180deg,#2f9e4a,#1b7a33);box-shadow:0 4px 10px -3px rgba(27,122,51,.55)}
.wa-send:hover:not(:disabled){background:linear-gradient(180deg,#279143,#14532d)}
.wa-send:disabled{background:#c9d8cd;box-shadow:none}
.wa-send svg{width:19px;height:19px}
.wa-day{background:none;box-shadow:none;color:#9ca3af;font-weight:600}
.bub{box-shadow:none;border-radius:16px;font-size:14.2px;padding:9px 13px 7px}
.bub:before{display:none!important}
.bub.me{background:#e6f4ea;border:1px solid #d3ead9;border-top-right-radius:16px}
.bub.bot{background:#fff;border:1px solid #eceef1;border-top-left-radius:16px}
.bub .foot svg{display:none}
.wa-banner{margin:14px max(24px,calc(50% - 390px)) 0}

.bub.has-chart{width:min(100%,700px);max-width:min(100%,700px)}
.botrow:has(.bub.has-chart){max-width:min(92%,760px);width:100%}
.chartbox{margin:2px 0 8px}
.ctitle b{display:block;font-size:14px;color:#111827}.ctitle span{display:block;font-size:11.5px;color:#6b7280;margin-top:1px}
.clegend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:#475569;margin:8px 0 -2px}.clegend span{display:inline-flex;align-items:center;gap:6px}.clegend i{width:10px;height:10px;border-radius:3px}
svg.chart{width:100%;height:auto;display:block;margin-top:8px}
.cactions{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-top:4px;font-size:12px}
.cactions summary{cursor:pointer;color:var(--green-dark);font-weight:600}
.cactions table{border-collapse:collapse;margin-top:6px;font-size:12px}.cactions th,.cactions td{border-bottom:1px solid #eef1f4;padding:4px 8px;text-align:right;white-space:nowrap}
.cactions th:first-child,.cactions td:first-child{text-align:left}.cactions th{color:#475569;font-weight:600}.cactions tfoot td{font-weight:700}
.pngbtn{border:1px solid #e5e7eb;background:#fff;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:600;color:#374151;cursor:pointer;white-space:nowrap}.pngbtn:hover{border-color:var(--green);color:var(--green-dark)}
</style>
</head>
<body>
<div class="card shell" style="padding-top:8px">
  <div class="tabs" role="tablist" id="tabbar">
    <button role="tab" data-tab="models" aria-selected="false">Models</button>
    <button role="tab" data-tab="optimise" aria-selected="false">Optimise</button>
    <button role="tab" data-tab="train" aria-selected="false">Train</button>
  </div>
  <div id="view"></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const API=(window.IMPILO_API_ORIGIN||"http://127.0.0.1:8765")+'/api/ai';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n==null?'—':Number(n).toLocaleString('en-GB');
const gb=b=>b==null?'—':(b/1024**3).toFixed(1)+' GB';
const day=d=>new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
// ?mode=ask: the chat ("Ask the data"). ?mode=config: Models, Optimise and Train ("Configuration").
const MODE=new URLSearchParams(location.search).get('mode')==='config'?'config':'ask';
let tab=MODE==='ask'?'ask':'models',st=null,assist=[],styles=[],editing=null,portal=null,chatAssistant=null,abort=null,pollTimer=null,confirmDelete=null;

async function call(path,opts={}){

  const body=r.headers.get('content-type')?.includes('json')?await r.json():{};
  if(!r.ok){const d=body.detail;throw Error(Array.isArray(d)?d.map(x=>`${x.loc?.slice(-1)[0]}: ${x.msg}`).join('; '):d||`Request failed (${r.status})`)}

function mdLite(text){ // safe: escape first, then a little formatting
  let h=esc(text).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  const lines=h.split('\n');let out='',inList=false;
  for(const l of lines){const m=l.match(/^\s*(?:[-*•]|\d+\.)\s+(.*)/);if(m){if(!inList){out+='<ul>';inList=true}out+=`<li>${m[1]}</li>`}else{if(inList){out+='</ul>';inList=false}out+=l?l+'<br>':'<br>'}}
  return (inList?out+'</ul>':out).replace(/(<br>)+$/,'');
}

function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v))),n=v/p;return(n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
const nf=n=>Number(n).toLocaleString('en-GB');
function chartSvg(c){
  const cats=c.categories,series=c.series;
  if(c.type==='pie'){
    const s=series[0],tot=s.values.reduce((a,b)=>a+b,0)||1,R=92,cx=110,cy=105;let a0=-Math.PI/2;
    const cols=['#218a39','#2563eb','#d97706','#c0367a','#0d9488','#7c3aed','#dc2626','#475569'];
    const sl=s.values.map((v,k)=>{if(!v)return'';const a1=a0+v/tot*Math.PI*2,big=a1-a0>Math.PI?1:0,mid=(a0+a1)/2;
      const d=v===tot?`M${cx-R},${cy}a${R},${R} 0 1 0 ${2*R},0a${R},${R} 0 1 0 ${-2*R},0`:`M${cx},${cy}L${cx+R*Math.cos(a0)},${cy+R*Math.sin(a0)}A${R},${R} 0 ${big} 1 ${cx+R*Math.cos(a1)},${cy+R*Math.sin(a1)}Z`;
      a0=a1;return`<path d="${d}" fill="${cols[k%cols.length]}" stroke="#fff" stroke-width="2"><title>${esc(cats[k])}: ${nf(v)}</title></path>`+(v/tot>.07?`<text x="${cx+R*.62*Math.cos(mid)}" y="${cy+R*.62*Math.sin(mid)}" text-anchor="middle" dominant-baseline="central" fill="#fff" font-size="11" font-weight="700">${Math.round(v/tot*100)}%</text>`:'')}).join('');
    const leg=cats.map((n,k)=>`<g transform="translate(240,${22+k*20})"><rect width="11" height="11" rx="3" fill="${cols[k%cols.length]}"/><text x="17" y="9.5" font-size="12" fill="#334155">${esc(n)}: ${nf(s.values[k])}</text></g>`).join('');
    return`<svg class="chart" viewBox="0 0 480 ${Math.max(215,30+cats.length*20)}" role="img" aria-label="${esc(c.title)}">${sl}${leg}</svg>`;
  }
  const W=640,H=270,L=44,T=12,Rm=10,rot=cats.length>7,B=rot?64:28,pw=W-L-Rm,ph=H-T-B,raw=Math.max(1,...series.flatMap(s=>s.values)),max=raw<=40?Math.max(4,Math.ceil(raw/4)*4):niceMax(raw);
  const y=v=>T+ph-(v/max)*ph,step=pw/Math.max(1,cats.length);
  const grid=[0,.25,.5,.75,1].map(f=>`<line x1="${L}" x2="${W-Rm}" y1="${y(max*f)}" y2="${y(max*f)}" stroke="#eef1f4"/><text x="${L-6}" y="${y(max*f)}" text-anchor="end" dominant-baseline="central" font-size="10.5" fill="#64748b">${nf(Math.round(max*f*100)/100)}</text>`).join('');
  const labels=cats.map((n,k)=>{const x=L+step*k+step/2,show=cats.length<=20||k%Math.ceil(cats.length/20)===0;return show?`<text x="${x}" y="${H-B+14}" font-size="10.5" fill="#475569" text-anchor="${rot?'end':'middle'}"${rot?` transform="rotate(-35 ${x} ${H-B+14})"`:''}>${esc(String(n).length>16?String(n).slice(0,15)+'…':n)}</text>`:''}).join('');
  let marks='';
  if(c.type==='line')marks=series.map(s=>`<polyline fill="none" stroke="${s.color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" points="${s.values.map((v,k)=>`${L+step*k+step/2},${y(v)}`).join(' ')}"/>`+s.values.map((v,k)=>`<circle cx="${L+step*k+step/2}" cy="${y(v)}" r="3.3" fill="#fff" stroke="${s.color}" stroke-width="2"><title>${esc(cats[k])} · ${esc(s.name)}: ${nf(v)}</title></circle>`).join('')).join('');
  else{const gw=step*.76,bw=gw/series.length;marks=series.map((s,j)=>s.values.map((v,k)=>`<rect x="${L+step*k+(step-gw)/2+bw*j}" y="${y(v)}" width="${Math.max(1,bw-1.5)}" height="${Math.max(0,T+ph-y(v))}" rx="2.5" fill="${s.color}"><title>${esc(cats[k])} · ${esc(s.name)}: ${nf(v)}</title></rect>`+(series.length*cats.length<=24&&v?`<text x="${L+step*k+(step-gw)/2+bw*j+(bw-1.5)/2}" y="${y(v)-4}" text-anchor="middle" font-size="10" fill="#475569">${nf(v)}</text>`:'')).join('')).join('')}
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.title)}">${grid}<line x1="${L}" x2="${W-Rm}" y1="${T+ph}" y2="${T+ph}" stroke="#cbd5e1"/>${marks}${labels}</svg>`;
}
function chartHtml(c){
  const legend=c.series.length>1&&c.type!=='pie'?`<div class="clegend">${c.series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`:'';
  const t=c.table,cell=v=>v==null?'–':typeof v==='number'?nf(v):esc(v);
  return`<div class="chartbox"><div class="ctitle"><b>${esc(c.title)}</b><span>${esc(c.subtitle||'')}</span></div>${legend}${chartSvg(c)}
    <div class="cactions"><details><summary>Show figures</summary><table><thead><tr>${t.header.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${t.rows.map(r=>`<tr>${r.map(cell).map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody>${t.total?`<tfoot><tr>${t.total.map(cell).map(v=>`<td>${v}</td>`).join('')}</tr></tfoot>`:''}</table></details>
    <button type="button" class="pngbtn" title="Download the chart as a picture">Download image</button></div></div>`;
}

    g.fillStyle='#0f172a';g.font='600 14px Inter, Segoe UI, Arial';g.fillText(title,12,22);g.fillStyle='#64748b';g.font='11.5px Inter, Segoe UI, Arial';g.fillText(sub,12,40);g.drawImage(img,0,52,W,vb.height);URL.revokeObjectURL(url);

function bubble(m,prev){

  const body=me?esc(m.content).replace(/\n/g,'<br>'):(m.content?mdLite(m.content):'<span class="dots"><i></i><i></i><i></i></span>');
  const html=`<div class="bub ${me?'me':'bot'}${cont?' cont':''}${m.error?' err':''}${m.writing?' writing':''}${m.chart?' has-chart':''}" data-t="${esc(m.time)}">${m.chart?chartHtml(m.chart):''}<span class="txt">${m.chart&&!m.content&&m.writing?'':body}</span><span class="foot">${hhmm(m.time)}${me?TICKS:''}</span>${!me&&cleanMeta(m.meta)?`<span class="src">${esc(cleanMeta(m.meta))}</span>`:''}</div>`;
  return me?html:`<div class="botrow${cont?' cont':''}"><div class="mini${m.writing||!m.content?' thinking':''}">${cont?'':BOT_ICON}</div>${html}</div>`;

function messagesHtml(c){

}

  const qa=$('q');qa.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}});

let chatsLoaded=false;function loadChatsOnce(){if(!chatsLoaded){loadChats();chatsLoaded=true}}
async function ask(){
  const q=$('q').value.trim();if(!q||abort)return;
  let c=chatById(currentChat)||newChat();
  // The thread so far (without failed replies) goes with the question, so follow-ups like "and in July?" work.
  const history=c.messages.filter(m=>!m.error&&m.content).map(m=>({role:m.role,content:m.content}));
  const now=new Date().toISOString();
  c.messages.push({role:'user',content:q,time:now});
  if(c.title==='New conversation')c.title=q.length>60?q.slice(0,57)+'…':q;
  const bot={role:'assistant',content:'',meta:'',time:now,writing:true};c.messages.push(bot);c.updated=now;c.assistantId=chatAssistant;saveChats();
  abort=new AbortController();const t0=performance.now();renderAsk();
  const box=()=>{const all=document.querySelectorAll('.wa-msgs .bub.bot');return all[all.length-1]};
  try{
    const r=await fetch(API+'/chat',{method:'POST',signal:abort.signal,headers:{'content-type':'application/json'},body:JSON.stringify({message:q,history,assistantId:chatAssistant,filters:filters()})});
    if(!r.ok){const b=await r.json().catch(()=>({}));throw Error(b.detail||`Request failed (${r.status})`)}
    const reader=r.body.getReader(),dec=new TextDecoder();let buf='';
    for(;;){const {value,done}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});
      let i;while((i=buf.indexOf('\n'))>=0){const line=buf.slice(0,i);buf=buf.slice(i+1);if(!line.trim())continue;const ev=JSON.parse(line);
        if(ev.type==='token'){bot.content+=ev.text;const b=box();if(b){b.querySelector('.txt').innerHTML=mdLite(bot.content);const m=$('msgs');m.scrollTop=m.scrollHeight}}
        else if(ev.type==='chart'){bot.chart=ev.chart;const b=box();if(b){b.classList.add('has-chart');b.insertAdjacentHTML('afterbegin',chartHtml(ev.chart));const t=b.querySelector('.txt');if(t&&!bot.content)t.innerHTML='';const m=$('msgs');m.scrollTop=m.scrollHeight}}
        else if(ev.type==='meta'){bot.meta=ev.grounded?"From the portal's figures":''}
        else if(ev.type==='done'){}
        else if(ev.type==='error'){throw Error(ev.message)}}}
    if(!bot.content){bot.content='The assistant did not return an answer. Please try asking again.';bot.error=true}
  }catch(e){if(e.name==='AbortError'){bot.meta=(bot.meta?bot.meta+' · ':'')+'stopped';if(!bot.content)bot.content='(Stopped.)'}else{bot.content=e.message;bot.error=true}}
  delete bot.writing;bot.time=new Date().toISOString();c.updated=bot.time;abort=null;saveChats();renderAsk();
}

        <label class="f" for="aInstr">Instructions - how it should behave</label><textarea id="aInstr" rows="4" placeholder="e.g. Always compare with the previous month. Flag positivity above 5%. Use Ministry terms.">${esc(a.instructions)}</textarea>
        <label class="f">Answer style</label><div class="styles">${styles.map(k=>`<label><input type="radio" name="aStyle" value="${k}"${a.style===k?' checked':''}><b>${STYLE_LABELS[k]?.[0]||k}</b><div class="help">${STYLE_LABELS[k]?.[1]||''}</div></label>`).join('')}</div>
        <div class="grid2"><div><label class="f" for="aLang">Language</label><select id="aLang">${['English','Shona','Ndebele'].map(l=>`<option${a.language===l?' selected':''}>${l}</option>`).join('')}</select><div class="help">Small models write Shona and Ndebele less reliably than English.</div></div>
          <div><div class="toggle"><input type="checkbox" id="aData"${a.usePortalData?' checked':''}><label for="aData"><b>Use live portal data</b><div class="help">Gives the assistant the current aggregated figures for the portal filters. Turn off for general questions.</div></label></div></div></div>
        <label class="f">Example questions and answers</label>
        <div class="help">For each question choose <b>Exact answer</b> (the wording you want back) or <b>How to answer</b> (guidance such as "give the total, compare with last month, flag anything above 5%"). Type them in, or upload a CSV, Excel or JSON file.</div>
        <div class="row" style="margin-top:10px"><button class="btn ghost sm" id="addEx">+ Add example</button>
          <label class="btn ghost sm" for="exFile" style="display:inline-block">Upload file</label><input type="file" id="exFile" accept=".csv,.xlsx,.json,.txt" hidden>
          <button class="btn ghost sm" id="exTemplate">Download template</button>
          ${a.examples.length?`<span class="sub" style="margin:0">${exSummary(a.examples)}</span><button class="linkbtn" id="exClear" style="margin-left:auto">${confirmDelete==='examples'?'Confirm remove all':'Remove all'}</button>`:''}</div>
        <div class="help" id="exMsg"></div>
        <div id="examples">${a.examples.map((e,i)=>i<(showAllEx?1e9:10)?exHtml(e,i):'').join('')}</div>
        ${a.examples.length>10&&!showAllEx?`<button class="linkbtn" id="exMore" style="margin-top:8px">Show all ${a.examples.length} examples</button>`:''}
        <div class="row" style="margin-top:18px"><button class="btn" id="build">Save and build</button><button class="btn ghost" id="saveOnly">Save only</button>
          ${a.id?'<button class="btn ghost" id="tryIt">Try it in Ask the data</button>':''}${a.id&&assist.length>1?`<button class="btn danger" id="delA" style="margin-left:auto">${confirmDelete===a.id?'Confirm delete':'Delete'}</button>`:''}</div>
        <div class="help" id="buildMsg"></div></div></div></div>`;
  bindGo();
  const collect=()=>{editing={...a,name:$('aName').value.trim(),baseModel:$('aBase').value,domain:$('aDomain').value,instructions:$('aInstr').value,style:document.querySelector('[name=aStyle]:checked')?.value||'concise',language:$('aLang').value,usePortalData:$('aData').checked,
    examples:mergeHidden([...document.querySelectorAll('.ex')].map(x=>({i:+x.dataset.i,question:x.querySelector('.exq').value.trim(),answer:x.querySelector('.exa').value.trim(),kind:x.querySelector('input[type=radio]:checked')?.value||'answer'})))};return editing};
  // Only the first 10 examples are shown until "Show all"; keep the hidden ones when collecting the form.
  function mergeHidden(shown){const all=a.examples.map(e=>({...e}));for(const x of shown){all[x.i]={question:x.question,answer:x.answer,kind:x.kind}}return all}
  document.querySelectorAll('[data-aid]').forEach(b=>b.addEventListener('click',()=>{editing=structuredClone(assist.find(x=>x.id===b.dataset.aid));confirmDelete=null;showAllEx=false;renderTrain()}));
  $('newAssistant').addEventListener('click',()=>{editing=blankAssistant();showAllEx=false;renderTrain()});
  $('addEx').addEventListener('click',()=>{collect();editing.examples.push({question:'',answer:'',kind:'answer'});showAllEx=true;renderTrain()});
  document.querySelectorAll('.ex input[type=radio]').forEach(r=>r.addEventListener('change',()=>{collect();renderTrain()}));
  $('exMore')?.addEventListener('click',()=>{collect();showAllEx=true;renderTrain()});
  $('exClear')?.addEventListener('click',()=>{collect();if(confirmDelete!=='examples'){confirmDelete='examples';renderTrain();return}confirmDelete=null;editing.examples=[];renderTrain()});
  $('exTemplate').addEventListener('click',()=>{const url=URL.createObjectURL(new Blob(['\ufeff'+EX_TEMPLATE],{type:'text/csv'}));const l=document.createElement('a');l.href=url;l.download='assistant-examples-template.csv';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)});
  $('exFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;collect();$('exMsg').textContent=`Reading ${file.name}…`;
    try{const fd=new FormData();fd.append('file',file);const r=await fetch(API+'/examples/parse',{method:'POST',body:fd});const b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b.detail||'Could not read the file.');
      editing.examples=[...editing.examples.filter(x=>x.question||x.answer),...b.examples];
      const skip=b.skipped.length?` ${b.skipped.length} row${b.skipped.length===1?'':'s'} skipped (${b.skipped.slice(0,3).map(x=>'row '+x.row+': '+x.reason).join('; ')}${b.skipped.length>3?'…':''}).`:'';
      renderTrain();$('exMsg').textContent=`Added ${b.examples.length} example${b.examples.length===1?'':'s'} from ${file.name}.${skip}${b.truncated?' Only the first 500 were kept.':''} Click "Save and build" to use them.`}
    catch(err){$('exMsg').textContent=err.message;toast(err.message,7000)}});
  document.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',()=>{collect();editing.examples.splice(+b.dataset.rm,1);renderTrain()}));
  const save=async()=>{const x=collect();if(!x.name){toast('Give the assistant a name.');return null}
    x.examples=x.examples.filter(e=>e.question&&e.answer);const r=await call('/assistants',{method:'PUT',body:JSON.stringify(x)});await loadAssistants();editing=structuredClone(assist.find(y=>y.id===r.id));return r};
  $('saveOnly').addEventListener('click',async()=>{try{if(await save()){toast('Saved.');renderTrain()}}catch(e){toast(e.message,7000)}});
  $('build').addEventListener('click',async()=>{try{const r=await save();if(!r)return;$('buildMsg').textContent='Building the custom model in Ollama…';
    const b=await call(`/assistants/${encodeURIComponent(r.id)}/build`,{method:'POST'});await loadAssistants();editing=structuredClone(assist.find(y=>y.id===b.id));await refresh();renderTrain();toast(`Built ${b.modelName}. Try it in Ask the data.`)}
    catch(e){toast(e.message,8000);$('buildMsg').textContent=e.message;renderTrain()}});
  $('tryIt')?.addEventListener('click',()=>{try{localStorage.setItem('impilo.ai.assistant',a.id)}catch{};openSection('Ask the data')});
  $('delA')?.addEventListener('click',async()=>{if(confirmDelete!==a.id){confirmDelete=a.id;renderTrain();return}confirmDelete=null;try{await call(`/assistants/${encodeURIComponent(a.id)}`,{method:'DELETE'});await loadAssistants();editing=null;await refresh();renderTrain();toast('Assistant deleted.')}catch(e){toast(e.message)}});
}

(async()=>{
  $('view').innerHTML='<div class="sub" style="padding:20px">Loading…</div>';
  await refresh();try{await loadAssistants()}catch{}
  setTab(tab);
})();
</script>
</body>
</html>
